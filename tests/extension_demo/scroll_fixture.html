<!doctype html><meta charset="utf-8"><title>Scrolling fixture</title>
<style>
body { margin:0; display:flex; gap:20px; overflow:hidden; }
.pane { width:300px; height:400px; overflow:auto; overscroll-behavior:contain; }
.row { height:100px; box-sizing:border-box; border-bottom:2px solid #333; font:24px sans-serif; }
</style>
<div class="pane" id="left"></div><div class="pane" id="right"></div>
<script>
for (const id of ['left','right']) for (let i=0;i<30;i++) {
  const row=document.createElement('div'); row.className='row';
  row.textContent=`${id} item ${i}`; row.style.background=i%2?'#ade':'#fda';
  document.getElementById(id).appendChild(row);
}
</script>
