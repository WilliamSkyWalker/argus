[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saygo-agent-control"
version = "0.4.6"
description = "Persistent visual control sessions for external programming agents"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
keywords = ["ai", "mcp", "automation", "device-control"]
# setup provisions an isolated runtime even where ensurepip is unavailable.
dependencies = ["Pillow>=10", "pip>=23.1"]

[project.urls]
Homepage = "https://saygo.work"
Repository = "https://github.com/WilliamSkyWalker/saygo"
Documentation = "https://github.com/WilliamSkyWalker/saygo/blob/main/docs/agent-control.md"
Issues = "https://github.com/WilliamSkyWalker/saygo/issues"

[project.optional-dependencies]
browser = ["playwright>=1.60,<2"]
selenium = ["selenium>=4"]
mobile = ["Appium-Python-Client>=4", "uiautomator2>=3.5,<4"]
mcp = ["mcp>=1.2,<3"]
qa = ["openai>=1"]
desktop = ["PySide6-Essentials>=6.8,<7", "keyring>=25,<26"]
windows = ["pyautogui>=0.9; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'"]
mac = ["pyautogui>=0.9; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'", "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'"]

[project.scripts]
saygo = "saygo.cli:main"
saygo-mcp = "saygo.mcp.server:main"
saygo-desktop = "saygo.desktop.app:main"

[tool.setuptools.packages.find]
include = ["saygo*"]

[tool.setuptools.package-data]
saygo = ["platforms/*.ps1", "devices/*.cjs", "skills/**/*.md", "skills/**/*.json", "skills/**/*.txt"]

[tool.setuptools.data-files]
"share/saygo/browser-extension" = ["extensions/saygo-browser/manifest.json", "extensions/saygo-browser/background.js", "extensions/saygo-browser/network.js", "extensions/saygo-browser/popup.html", "extensions/saygo-browser/popup.js", "extensions/saygo-browser/LICENSE"]
"share/saygo/browser-extension/icons" = ["extensions/saygo-browser/icons/*.png"]
