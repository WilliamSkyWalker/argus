name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover -s tests/control_demo -p 'test_*install*.py' -v
      - run: python -m unittest discover -s tests/control_demo -p test_updates.py -v
      - run: python -m unittest discover -s tests/extension_demo -p test_bridge.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/extension_demo/test_*.mjs
      - name: Check tag matches release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG'] == 'v'+json.load(open('distribution/release.json'))['version']"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: saygo-release
          path: dist/release/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "Saygo $RELEASE_TAG" --notes-file distribution/RELEASE_NOTES.md
