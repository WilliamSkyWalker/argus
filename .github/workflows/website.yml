name: Deploy Saygo website
on:
  push:
    branches: [main]
    paths:
      - 'website-project/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: saygo-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate website assets
        run: |
          test -s website-project/index.html
          test -s website-project/public/videos/brand.mp4
          node --check website-project/app.js
          node --check website-project/site-config.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website-project
      - uses: actions/deploy-pages@v4
        id: deployment
