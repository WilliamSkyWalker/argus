name: Desktop development builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[desktop,windows,mac]' pyinstaller
      - run: python -m unittest discover -s tests/desktop_demo -v
      - name: Qt startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m argus.desktop.app --smoke-test
      - run: python scripts/build_desktop.py
      - run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArgusDesktop-${{ matrix.os }}
          path: dist/installers/
