<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Argus Browser</title>

<h2>Argus Browser</h2>
<p>Connect to let Argus operate all website tabs in this browser profile, including new tabs and popups. HTTP, WebSocket and SSE traffic is recorded automatically while connected.</p>

<button id="release">Release browser and disconnect</button>
<pre id="status"></pre><script src="popup.js"></script></html>
